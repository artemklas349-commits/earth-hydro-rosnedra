  <script>
  // Keep links actionable when the banner is embedded in Bitrix via iframe.
  (function(){
    const links={'#services':'https://rosnedra72.ru/services/','#company':'https://rosnedra72.ru/about/','#contacts':'https://rosnedra72.ru/contacts/'};
    function wire(){
      document.querySelectorAll('.hero a[href]').forEach(a=>{
        const target=links[a.getAttribute('href')];
        if(target){a.href=target;a.target='_top';a.rel='noopener';}
      });
    }
    new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
  })();
  </script>
